<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15231d" />
    <title>Würfelwerk</title>

    <style>
      :root {
        color: #f6f0df;
        background: #15231d;
        font-family:
          Avenir Next,
          Segoe UI,
          Helvetica Neue,
          Helvetica,
          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      select,
      input {
        -webkit-tap-highlight-color: transparent;
      }

      [hidden] {
        display: none !important;
      }

      .dice-shell {
        isolation: isolate;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 18%, rgb(244 200 74 / 9%) 0 1px, transparent 2px),
          radial-gradient(circle at 82% 72%, rgb(255 255 255 / 6%) 0 1px, transparent 2px), #15231d;
        background-size:
          29px 29px,
          41px 41px;
      }

      .dice-toolbar {
        z-index: 2;
        display: grid;
        grid-template-columns: auto minmax(230px, 1fr) auto;
        align-items: center;
        gap: clamp(16px, 3vw, 40px);
        padding: 16px clamp(18px, 4vw, 56px);
        color: #172019;
        background: #f3ead6;
        border-bottom: 3px solid #101914;
        box-shadow: 0 8px 0 rgb(8 15 11 / 20%);
      }

      .dice-home {
        display: flex;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
      }

      .dice-home:focus-visible,
      .dice-footer a:focus-visible {
        outline: 3px solid #d84630;
        outline-offset: 4px;
      }

      .dice-home-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        color: #fff9e9;
        background: #d84630;
        border: 2px solid #8f271b;
        border-radius: 10px;
        box-shadow: 0 4px 0 #8f271b;
        font-size: 1.25rem;
        font-weight: 950;
        transform: rotate(-4deg);
      }

      .dice-home-copy {
        display: grid;
        gap: 1px;
      }

      .dice-home-copy strong {
        font-family: Georgia, Charter, serif;
        font-size: 1.15rem;
        line-height: 1;
      }

      .dice-home-copy span {
        color: #586059;
        font-size: 0.67rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dice-settings {
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 10px;
      }

      .dice-field {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .dice-field > span {
        color: #596058;
        font-size: 0.65rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .dice-field select,
      .dice-field input {
        height: 42px;
        min-width: 0;
        padding: 7px 34px 7px 11px;
        color: #172019;
        background: #fffaf0;
        border: 2px solid #777d75;
        border-radius: 8px;
        outline: none;
        font-weight: 850;
      }

      .dice-field select:focus,
      .dice-field input:focus {
        border-color: #d84630;
        box-shadow: 0 0 0 3px rgb(216 70 48 / 20%);
      }

      .dice-preset-field {
        width: min(280px, 32vw);
      }

      .custom-dice-fields {
        display: flex;
        gap: 10px;
      }

      .custom-dice-fields .dice-field {
        width: 92px;
      }

      .custom-dice-fields input {
        padding-right: 10px;
      }

      .space-hint {
        display: grid;
        gap: 3px;
        justify-items: end;
        color: #596058;
        font-size: 0.65rem;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      kbd {
        display: inline-block;
        padding: 5px 9px 4px;
        color: #172019;
        background: #fffaf0;
        border: 1px solid #92978f;
        border-bottom-width: 3px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 900;
        line-height: 1;
      }

      .dice-stage {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 0;
        padding: clamp(34px, 7vh, 82px) clamp(18px, 5vw, 72px);
        overflow: hidden;
        cursor: pointer;
        touch-action: manipulation;
      }

      .dice-stage::before,
      .dice-stage::after {
        position: absolute;
        z-index: -1;
        content: "";
        border: 1px solid rgb(246 240 223 / 12%);
        border-radius: 50%;
      }

      .dice-stage::before {
        width: min(74vw, 900px);
        aspect-ratio: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .dice-stage::after {
        width: min(52vw, 650px);
        aspect-ratio: 1;
        top: 50%;
        left: 50%;
        border-style: dashed;
        transform: translate(-50%, -50%) rotate(12deg);
      }

      .roll-panel {
        display: grid;
        gap: clamp(22px, 4vh, 42px);
        justify-items: center;
        width: min(100%, 1120px);
        text-align: center;
      }

      .roll-heading {
        display: grid;
        gap: 6px;
      }

      .roll-kicker {
        margin: 0;
        color: #f4c84a;
        font-size: 0.72rem;
        font-weight: 950;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .roll-title {
        margin: 0;
        font-family: Georgia, Charter, serif;
        font-size: clamp(2.35rem, 7vw, 5.3rem);
        line-height: 0.92;
        text-wrap: balance;
      }

      .roll-instruction {
        margin: 3px 0 0;
        color: #abb6ae;
        font-size: clamp(0.88rem, 2vw, 1.05rem);
        font-weight: 700;
      }

      .dice-results {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: center;
        gap: clamp(14px, 3vw, 30px);
        width: 100%;
        min-height: clamp(164px, 25vw, 260px);
      }

      .die-result {
        display: grid;
        gap: 10px;
        justify-items: center;
      }

      .die {
        position: relative;
        display: grid;
        place-items: center;
        width: clamp(126px, 19vw, 210px);
        aspect-ratio: 1;
        color: #18211b;
        background: #fffaf0;
        border: 3px solid #111914;
        border-radius: clamp(18px, 3vw, 30px);
        box-shadow:
          0 11px 0 #0b120e,
          0 21px 40px rgb(0 0 0 / 28%);
        transform-origin: 50% 85%;
      }

      .dice-results.is-many .die {
        width: clamp(82px, 13vw, 142px);
        border-radius: clamp(14px, 2vw, 23px);
        box-shadow:
          0 8px 0 #0b120e,
          0 16px 28px rgb(0 0 0 / 24%);
      }

      .die::after {
        position: absolute;
        inset: 7% 10% auto;
        height: 16%;
        background: linear-gradient(to bottom, rgb(255 255 255 / 44%), transparent);
        border-radius: 999px;
        content: "";
        pointer-events: none;
      }

      .color-die {
        background: var(--die-color);
      }

      .shape-die {
        color: #1b2720;
        background: #f3ead6;
      }

      .shape-die svg {
        width: 64%;
        height: 64%;
        filter: drop-shadow(0 5px 0 rgb(0 0 0 / 14%));
      }

      .result-name {
        display: grid;
        gap: 1px;
        color: #f6f0df;
        font-size: 1rem;
        font-weight: 950;
        line-height: 1;
      }

      .result-name small {
        color: #9fac9f;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .pip-grid {
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        width: 68%;
        aspect-ratio: 1;
      }

      .pip {
        place-self: center;
        width: clamp(13px, 2.5vw, 25px);
        aspect-ratio: 1;
        background: #18211b;
        border-radius: 50%;
        box-shadow: inset 0 -3px 0 rgb(255 255 255 / 12%);
        opacity: 0;
      }

      .dice-results.is-many .pip {
        width: clamp(10px, 1.7vw, 17px);
      }

      .pip.is-visible {
        opacity: 1;
      }

      .number-face {
        display: grid;
        gap: 0;
        justify-items: center;
        font-family: Georgia, Charter, serif;
        font-size: clamp(3.6rem, 8vw, 6.8rem);
        font-weight: 900;
        line-height: 0.82;
      }

      .dice-results.is-many .number-face {
        font-size: clamp(2.7rem, 6vw, 4.8rem);
      }

      .number-face small {
        color: #657067;
        font-family:
          Avenir Next,
          Segoe UI,
          sans-serif;
        font-size: 0.7rem;
        font-weight: 950;
        letter-spacing: 0.12em;
      }

      .roll-button {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        min-height: 54px;
        padding: 11px 14px 11px 24px;
        color: #172019;
        background: #f4c84a;
        border: 2px solid #967313;
        border-radius: 999px;
        box-shadow: 0 6px 0 #967313;
        cursor: pointer;
        font-weight: 950;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .roll-button:hover {
        background: #ffdb64;
        transform: translateY(-1px);
      }

      .roll-button:active {
        box-shadow: 0 2px 0 #967313;
        transform: translateY(4px);
      }

      .roll-button:focus-visible {
        outline: 3px solid #fffaf0;
        outline-offset: 5px;
      }

      .roll-button kbd {
        border-color: #a58e4d;
      }

      .dice-results.is-rolling .die {
        animation: tumble 430ms cubic-bezier(0.2, 0.9, 0.35, 1.15) both;
      }

      .dice-results.is-rolling .die-result:nth-child(2) .die {
        animation-delay: 35ms;
      }

      .dice-results.is-rolling .die-result:nth-child(3) .die {
        animation-delay: 70ms;
      }

      .dice-results.is-rolling .die-result:nth-child(4) .die {
        animation-delay: 105ms;
      }

      .dice-results.is-rolling .die-result:nth-child(5) .die {
        animation-delay: 140ms;
      }

      .dice-footer {
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 11px clamp(18px, 4vw, 56px) 13px;
        color: #819087;
        border-top: 1px solid rgb(246 240 223 / 12%);
        font-size: 0.72rem;
        font-weight: 750;
      }

      .dice-footer a {
        color: #b8c3bb;
        text-underline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes tumble {
        0% {
          opacity: 0.45;
          transform: translateY(-34px) rotate(-10deg) scale(0.86);
        }
        58% {
          opacity: 1;
          transform: translateY(5px) rotate(4deg) scale(1.04);
        }
        100% {
          transform: translateY(0) rotate(0) scale(1);
        }
      }

      @media (max-width: 800px) {
        .dice-toolbar {
          grid-template-columns: 1fr auto;
          gap: 13px 18px;
          padding: 13px 16px 16px;
        }

        .dice-settings {
          grid-column: 1 / -1;
          justify-content: stretch;
          order: 3;
        }

        .dice-preset-field {
          flex: 1;
          width: auto;
        }

        .space-hint {
          align-self: start;
        }

        .dice-stage {
          padding-top: 32px;
          padding-bottom: 38px;
        }

        .roll-title {
          font-size: clamp(2.2rem, 12vw, 4.4rem);
        }
      }

      @media (max-width: 520px) {
        .dice-home-copy span,
        .space-hint span,
        .roll-button kbd {
          display: none;
        }

        .dice-settings {
          align-items: stretch;
          flex-direction: column;
        }

        .custom-dice-fields,
        .custom-dice-fields .dice-field {
          width: 100%;
        }

        .custom-dice-fields .dice-field {
          flex: 1;
        }

        .dice-field select,
        .dice-field input {
          width: 100%;
        }

        .dice-results {
          gap: 13px;
          min-height: 148px;
        }

        .die {
          width: clamp(116px, 36vw, 154px);
        }

        .dice-results.is-many .die {
          width: clamp(76px, 24vw, 105px);
        }

        .dice-footer {
          justify-content: center;
        }

        .dice-footer span {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dice-results.is-rolling .die {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>

  <body>
    <div class="dice-shell">
      <header class="dice-toolbar">
        <a class="dice-home" href="../" aria-label="Zurück zum Labyrinth-Drucker">
          <span class="dice-home-mark" aria-hidden="true">←</span>
          <span class="dice-home-copy">
            <strong>Würfelwerk</strong>
            <span>Zurück zum Drucker</span>
          </span>
        </a>

        <div class="dice-settings" aria-label="Würfel einstellen">
          <label class="dice-field dice-preset-field">
            <span>Würfelset</span>
            <select id="dice-preset">
              <option value="color-shape">Farbe &amp; Form</option>
              <option value="kniffel">Kniffel · 5 × W6</option>
              <option value="double-six">Zwei Würfel · 2 × W6</option>
              <option value="custom">Eigenes Set</option>
            </select>
          </label>

          <div id="custom-dice-fields" class="custom-dice-fields" hidden>
            <label class="dice-field">
              <span>Anzahl</span>
              <input id="dice-count" type="number" min="1" max="12" value="3" inputmode="numeric" />
            </label>
            <label class="dice-field">
              <span>Seiten</span>
              <select id="dice-sides">
                <option value="4">W4</option>
                <option value="6" selected>W6</option>
                <option value="8">W8</option>
                <option value="10">W10</option>
                <option value="12">W12</option>
                <option value="20">W20</option>
              </select>
            </label>
          </div>
        </div>

        <div class="space-hint" aria-hidden="true">
          <span>Oder drücken</span>
          <kbd>Leertaste</kbd>
        </div>
      </header>

      <main id="dice-stage" class="dice-stage">
        <section class="roll-panel" aria-labelledby="roll-title">
          <div class="roll-heading">
            <p id="roll-kicker" class="roll-kicker">Bereit</p>
            <h1 id="roll-title" class="roll-title">Farbe &amp; Form</h1>
            <p class="roll-instruction">Tippe irgendwo auf die Spielfläche.</p>
          </div>

          <div id="dice-results" class="dice-results" aria-hidden="true"></div>
          <p id="roll-announcement" class="sr-only" aria-live="polite"></p>

          <button id="roll-dice" class="roll-button" type="button" aria-keyshortcuts="Space">
            <span>Würfeln</span>
            <kbd aria-hidden="true">Leertaste</kbd>
          </button>
        </section>
      </main>

      <footer class="dice-footer">
        <span>Ein kleines Werkzeug für den Spieltisch.</span>
        <a href="https://github.com/christophsturm/jakobs-labyrinth">Quellcode auf GitHub</a>
      </footer>
    </div>

    <script type="module" src="/dice/main.ts"></script>
  </body>
</html>
